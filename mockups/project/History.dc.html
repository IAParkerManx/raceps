<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RacePS History</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f4f5f7;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #ff5a1f;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0d10; color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 20px 16px 0">
    <h1 style="margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.02em">History</h1>
  </header>

  <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 12px 16px 0">
    <sc-for list="{{ filters }}" as="filter" hint-placeholder-count="3">
      <button type="button" aria-pressed="{{ filter.pressed }}" onClick="{{ filter.pick }}" style="{{ filter.style }}">{{ filter.label }}</button>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px 16px 0">
    <sc-for list="{{ sessions }}" as="session" hint-placeholder-count="4">
      <a href="Session.dc.html" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 84px; box-sizing: border-box; background: #15181d; border: 1px solid #272b33; border-radius: 16px; padding: 12px 14px 12px 16px">
        <span style="display: flex; flex-direction: column; gap: 3px; min-width: 0">
          <span style="font-size: 16px; font-weight: 700">{{ session.car }}</span>
          <span style="color: #a0a6b1; font-size: 13px">{{ session.date }}, {{ session.runs }} runs</span>
          <span style="color: #a0a6b1; font-size: 13px">Best {{ session.best }}</span>
        </span>
        <span style="display: flex; align-items: center; gap: 8px; flex-shrink: 0">
          <span style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px">
            <span style="font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums">{{ session.median }}</span>
            <span style="color: #a0a6b1; font-size: 12px">median {{ session.metric }}</span>
          </span>
          <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#a0a6b1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"></path></svg>
        </span>
      </a>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 16px">
    <span style="color: #a0a6b1; font-size: 13px">20 of 200 runs saved on this phone</span>
    <a href="Settings.dc.html" style="display: flex; align-items: center; min-height: 44px; color: #ff5a1f; font-size: 14px; font-weight: 700">Back up</a>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #272b33; background: #0b0d10">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #a0a6b1; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a9 9 0 1 1 16 0"></path><path d="M12 14l4-5"></path><circle cx="12" cy="14" r="1.2"></circle></svg>
      Run
    </a>
    <a href="History.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #ff5a1f; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
      History
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #a0a6b1; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { car: 'All cars' };
  }
  renderVals() {
    const picked = this.state.car;
    const base = 'min-height: 44px; padding: 0 14px; border-radius: 99px; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;';
    const all = [
      { car: 'Golf GTI', date: 'Thu 5 Nov', runs: 5, median: '5.51 s', metric: '0-100 km/h', best: '5.42 s' },
      { car: 'Golf GTI', date: 'Sat 31 Oct', runs: 8, median: '5.68 s', metric: '0-100 km/h', best: '5.55 s' },
      { car: 'Polo GTI', date: 'Sat 24 Oct', runs: 3, median: '7.12 s', metric: '0-100 km/h', best: '7.04 s' },
      { car: 'No car recorded', date: 'Tue 13 Oct', runs: 4, median: '5.94 s', metric: '0-100 km/h', best: '5.81 s' },
    ];
    return {
      filters: ['All cars', 'Golf GTI', 'Polo GTI'].map((label) => ({
        label,
        pressed: label === picked ? 'true' : 'false',
        style: base + (label === picked
          ? ' border: 1px solid #ff5a1f; background: #ff5a1f; color: #140600;'
          : ' border: 1px solid #272b33; background: transparent; color: #f4f5f7;'),
        pick: () => this.setState({ car: label }),
      })),
      sessions: picked === 'All cars' ? all : all.filter((s) => s.car === picked),
    };
  }
}
</script>
</body>
</html>
