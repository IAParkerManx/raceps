<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RacePS Run, Ready</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#f4f5f7;text-decoration:none}
a:focus-visible,button:focus-visible{outline:2px solid #ff5a1f;outline-offset:2px}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #0b0d10; color: #f4f5f7; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; flex-direction: column">
  <header style="padding: 20px 16px 0">
    <h1 style="margin: 0; font-size: 22px; font-style: italic; font-weight: 800; letter-spacing: -0.02em">Race<span style="color: #ff5a1f">PS</span></h1>
  </header>

  <div role="status" style="margin: 16px 16px 0; border: 2px solid #3ddc84; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; gap: 12px">
    <svg aria-hidden="true" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#3ddc84" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
    <span style="color: #3ddc84; font-size: 34px; font-weight: 800; letter-spacing: -0.01em">Ready</span>
  </div>

  <section style="text-align: center; padding: 32px 0 24px">
    <div style="font-size: 200px; font-weight: 800; letter-spacing: -0.04em; line-height: 1; font-variant-numeric: tabular-nums">0</div>
    <div style="color: #a0a6b1; font-size: 14px; font-weight: 600; letter-spacing: 0.12em">KM/H</div>
  </section>

  <dl style="margin: 0 16px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <sc-for list="{{ sensors }}" as="sensor" hint-placeholder-count="3">
      <div style="background: #15181d; border: 1px solid #272b33; border-radius: 12px; padding: 10px 12px">
        <dt style="color: #a0a6b1; font-size: 12px">{{ sensor.name }}</dt>
        <dd style="margin: 2px 0 0; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums">{{ sensor.value }}</dd>
      </div>
    </sc-for>
  </dl>

  <section style="margin: 12px 16px 0; background: #15181d; border: 1px solid #272b33; border-radius: 16px; padding: 12px 16px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px">
    <span style="font-size: 14px; color: #d6d9de">Last run, 0-100 km/h</span>
    <span style="font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums">5.42 s <small style="color: #a0a6b1; font-size: 13px; font-weight: 500">±0.15</small></span>
  </section>

  <div style="margin-top: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px">
    <button type="button" aria-pressed="{{ voiceOn }}" onClick="{{ toggleVoice }}" style="min-height: 56px; border-radius: 14px; border: 1px solid #272b33; background: transparent; color: #f4f5f7; font: inherit; font-size: 16px; font-weight: 700; cursor: pointer">{{ voiceLabel }}</button>
    <a href="RunLive.dc.html" style="text-align: center; color: #a0a6b1; font-size: 13px; padding: 4px; text-decoration: underline">Prototype only: simulate a launch</a>
  </div>

  <nav aria-label="Main" style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #272b33; background: #0b0d10">
    <a href="Main.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #ff5a1f; font-size: 12px; font-weight: 700">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 18a9 9 0 1 1 16 0"></path><path d="M12 14l4-5"></path><circle cx="12" cy="14" r="1.2"></circle></svg>
      Run
    </a>
    <a href="History.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #a0a6b1; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"></path><path d="M4 6h.01M4 12h.01M4 18h.01"></path></svg>
      History
    </a>
    <a href="Settings.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 64px; color: #a0a6b1; font-size: 12px; font-weight: 600">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"></path><circle cx="16" cy="7" r="2"></circle><circle cx="8" cy="17" r="2"></circle></svg>
      Settings
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { voice: true };
  }
  renderVals() {
    const voice = this.state.voice;
    return {
      sensors: [
        { name: 'GPS accuracy', value: '4 m' },
        { name: 'GPS rate', value: '10 Hz' },
        { name: 'Motion', value: 'Active' },
      ],
      voiceOn: voice ? 'true' : 'false',
      voiceLabel: voice ? 'Voice callouts on' : 'Voice callouts off',
      toggleVoice: () => this.setState({ voice: !voice }),
    };
  }
}
</script>
</body>
</html>
